name: Drupal CI and Deploy

on:
  # Every pull request to main must pass the CI checks.
  pull_request:
    branches:
      - main
  # Publish and deploy only changes pushed to main.
  push:
    branches:
      - main
  # Allow an operator to rerun the pipeline from the main branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Prevent two deployments from changing production at the same time.
  group: brandhub-drupal-production
  cancel-in-progress: false

jobs:
  ci:
    name: Composer and PHP syntax
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, intl, mbstring, pdo_mysql, zip, xml
          tools: composer:v2
          coverage: none

      - name: Validate Composer files
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Audit Composer dependencies
        run: composer audit

      - name: Check PHP syntax
        # Check project PHP files while avoiding a redundant scan of vendor packages.
        run: find web/modules/custom web/sites -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l

  publish:
    name: Build and publish Drupal image
    needs: ci
    # Pull requests run checks but must not publish images or use deployment secrets.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push commit and latest tags
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

  deploy:
    name: Deploy exact image to AWS EC2
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
      EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
      MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
      MYSQL_USER: ${{ secrets.MYSQL_USER }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      DRUPAL_HASH_SALT: ${{ secrets.DRUPAL_HASH_SALT }}
      DRUPAL_IMAGE: ghcr.io/${{ github.repository }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Check out source for the Compose file
        uses: actions/checkout@v4

      - name: Configure SSH with pinned EC2 host key
        run: |
          set -euo pipefail
          test -n "$EC2_SSH_PRIVATE_KEY"
          test -n "$EC2_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Copy Compose file and production environment
        run: |
          set -euo pipefail
          TARGET="${EC2_USER}@${EC2_HOST}"
          SSH_OPTS=(-i "$HOME/.ssh/deploy_key" -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o StrictHostKeyChecking=yes)

          ssh "${SSH_OPTS[@]}" "$TARGET" 'mkdir -p "$HOME/brandhub-drupal"'
          scp "${SSH_OPTS[@]}" docker-compose.prod.yml "$TARGET:brandhub-drupal/docker-compose.prod.yml"

          # Secrets are streamed over SSH into a mode-600 .env file on EC2.
          printf '%s\n' \
            "MYSQL_DATABASE=$MYSQL_DATABASE" \
            "MYSQL_USER=$MYSQL_USER" \
            "MYSQL_PASSWORD=$MYSQL_PASSWORD" \
            "MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD" \
            "DRUPAL_HASH_SALT=$DRUPAL_HASH_SALT" \
            "DRUPAL_DB_HOST=mysql" \
            "DRUPAL_DB_PORT=3306" \
            "DRUPAL_IMAGE=$DRUPAL_IMAGE" \
            "IMAGE_TAG=$IMAGE_TAG" |
            ssh "${SSH_OPTS[@]}" "$TARGET" 'umask 077; cat > "$HOME/brandhub-drupal/.env"'

      - name: Pull and deploy the exact commit image
        run: |
          set -euo pipefail
          TARGET="${EC2_USER}@${EC2_HOST}"
          SSH_OPTS=(-i "$HOME/.ssh/deploy_key" -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o StrictHostKeyChecking=yes)

          # GHCR is public, so EC2 pulls without registry credentials.
          # Compose uses the SHA-tagged image; --no-build prevents any EC2-side image build.
          ssh "${SSH_OPTS[@]}" "$TARGET" '
            set -e
            cd "$HOME/brandhub-drupal"
            docker compose -f docker-compose.prod.yml pull drupal
            docker compose -f docker-compose.prod.yml up -d --no-build
            docker compose -f docker-compose.prod.yml exec -T drupal vendor/bin/drush updatedb -y
            docker compose -f docker-compose.prod.yml exec -T drupal vendor/bin/drush config:import -y
            docker compose -f docker-compose.prod.yml exec -T drupal vendor/bin/drush cache:rebuild
            curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 5 http://127.0.0.1:8080/ >/dev/null
          '
